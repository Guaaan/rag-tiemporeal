[project]
# Whether to enable telemetry (default: true). No personal data is collected.
public = true
project_id = "realtime_chatbot"
enable_telemetry = true
chatbot_name = "Asistente ITAM"



[auth]
# Authentication configuration.
# If you want to use authentication, set this to true.
enabled = true

[oauth_providers.azure-ad]
client_id = "${AZURE_CLIENT_ID}"
client_secret = "${AZURE_CLIENT_SECRET}"
authorize_url = "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/authorize"
access_token_url = "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token"
user_info_url = "https://graph.microsoft.com/v1.0/me"
scopes = ["User.Read"]
redirect_uri = "https://voxbotitam.chilecentral.cloudapp.azure.com/auth/oauth/azure-ad/callback"

# List of environment variables to be provided by each user to use the app.
user_env = ["AZURE_OPENAI_API_KEY"]

# Duration (in seconds) during which the session is saved when the connection is lost
session_timeout = 3600

# Duration (in seconds) of the user session expiry
user_session_timeout = 1296000  # 15 days

# Enable third parties caching (e.g., LangChain cache)
cache = false

# Authorized origins
allow_origins = ["*"]

[features]
# Process and display HTML in messages. This can be a security risk (see https://stackoverflow.com/questions/19603097/why-is-it-dangerous-to-render-user-generated-html-or-javascript)
unsafe_allow_html = false

# Process and display mathematical expressions. This can clash with "$" characters in messages.
latex = false

# Autoscroll new user messages at the top of the window
user_message_autoscroll = true

# Automatically tag threads with the current chat profile (if a chat profile is used)
auto_tag_thread = true

# Allow users to edit their own messages
edit_message = true

# Authorize users to spontaneously upload files with messages
[features.spontaneous_file_upload]
    enabled = true
    # Define accepted file types using MIME types
    # Examples:
    # 1. For specific file types:
    #    accept = ["image/jpeg", "image/png", "application/pdf"]
    # 2. For all files of certain type:
    #    accept = ["image/*", "audio/*", "video/*"]
    # 3. For specific file extensions:
    #    accept = { "application/octet-stream" = [".xyz", ".pdb"] }
    # Note: Using "*/*" is not recommended as it may cause browser warnings
    accept = ["*/*"]
    max_files = 20
    max_size_mb = 500

[features.audio]
    # Sample rate of the audio
    sample_rate = 24000

[features.mcp.sse]
    enabled = true

[features.mcp.stdio]
    enabled = true
    # Only the executables in the allow list can be used for MCP stdio server.
    # Only need the base name of the executable, e.g. "npx", not "/usr/bin/npx".
    # Please don't comment this line for now, we need it to parse the executable name.
    allowed_executables = [ "npx", "uvx" ]

[UI]

# Name of the assistant.
name = "Asistente ITAM"
translation = "es-ES"
# Custom login page image, relative to public directory or external URL
sidebar_logo = "/public/background.png"
# Custom login page image, relative to public directory or external URL
login_page_image = "https://www.itam.cl/data1/images/3.jpg"
default_theme = "light"
custom_meta_image_url = "https://tienda.itam.cl/wp-content/uploads/2020/10/itam_logotipo-ecomerce.png"


[UI.theme]
    default = "light"

    # Override default MUI light theme. (Check theme.ts)
    [UI.theme.light]
        #background = "#FAFAFA"
        #paper = "#FFFFFF"

        [UI.theme.light.primary]
            main = "210 100% 50%"  # Azul
            dark = "210 100% 40%"  # Azul oscuro
            light = "195 100% 90%" # Celeste claro

    # Override default MUI dark theme. (Check theme.ts)
    [UI.theme.dark]
        #background = "#FAFAFA"
        #paper = "#FFFFFF"

        [UI.theme.dark.primary]
            main = "195 100% 50%"  # Celeste
            dark = "195 100% 40%"  # Celeste oscuro
            light = "210 100% 90%" # Azul claro

layout = "wide"

default_sidebar_state = "collapsed"

# Description of the assistant. This is used for HTML tags.
# description = ""

# Chain of Thought (CoT) display mode. Can be "hidden", "tool_call" or "full".
cot = "full"
# Link to your github repo. This will add a github button in the UI's header.
# github = "https://github.com/Guaaan/rag-voice-bot"
# Specify a CSS file that can be used to customize the user interface.
# The CSS file can be served from the public directory or via an external link.
custom_css = "/public/test.css"

